name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: read
  pull-requests: read

jobs:
  build-firmware:
    permissions:
      contents: write
      pull-requests: read
    uses: ./.github/workflows/build-firmware.yml
    secrets: inherit

  build-prf:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/build-prf.yml
    secrets: inherit

  build-qemu:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/build-qemu.yml
    secrets: inherit

  build-qemu-sdkshell:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/build-qemu-sdkshell.yml
    secrets: inherit

  release:
    runs-on: ubuntu-24.04

    needs:
      - build-firmware
      - build-prf
      - build-qemu
      - build-qemu-sdkshell
    permissions:
      contents: write

    env:
      TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir release
          find artifacts -type f -exec cp {} release/ \;

          boards=(asterix obelix_dvt obelix_pvt getafix_dvt getafix_dvt2)
          for board in "${boards[@]}"; do
            # shellcheck disable=SC2206
            pbzs=(release/normal_${board}_*.pbz)
            installable=()
            for pbz in "${pbzs[@]}"; do
              if [[ "$pbz" != *_slot0.pbz && "$pbz" != *_slot1.pbz ]]; then
                installable+=("$pbz")
              fi
            done
            if (( ${#installable[@]} != 1 )); then
              printf 'Expected one installable %s PBZ, found %d\n' \
                "$board" "${#installable[@]}" >&2
              exit 1
            fi
            cp "${installable[0]}" "release/PebbleOS-${board}.pbz"
          done
          (
            cd release
            sha256sum -- PebbleOS-*.pbz > SHA256SUMS
          )
          ls -l release

      - name: Create release
        uses: softprops/action-gh-release@v3.0.2
        with:
          files: release/*

      - name: Publish release to eng-dash
        if: ${{ github.repository == 'coredevices/PebbleOS' }}
        uses: ./.github/actions/publish-engdash
        with:
          version: ${{ env.TAG }}
          token: ${{ secrets.ENGDASH_OTA_TOKEN }}
