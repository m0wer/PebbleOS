name: Release

on:
  push:
    tags:
      - v*

jobs:
  build-firmware:
    permissions:
      contents: write
      pull-requests: read
    uses: ./.github/workflows/build-firmware.yml
    secrets: inherit

  build-prf:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/build-prf.yml
    secrets: inherit

  build-qemu:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/build-qemu.yml
    secrets: inherit

  build-qemu-sdkshell:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/build-qemu-sdkshell.yml
    secrets: inherit

  release:
    runs-on: ubuntu-24.04

    needs:
      - build-firmware
      - build-prf
      - build-qemu
      - build-qemu-sdkshell
    permissions:
      contents: write

    env:
      TAG: ${{ github.ref_name }}

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir release
          find artifacts -type f -exec cp {} release/ \;

          boards=(asterix obelix_dvt obelix_pvt getafix_dvt getafix_dvt2)
          for board in "${boards[@]}"; do
            # shellcheck disable=SC2206
            pbzs=(release/normal_${board}_*.pbz)
            installable=()
            for pbz in "${pbzs[@]}"; do
              if [[ "$pbz" != *_slot0.pbz && "$pbz" != *_slot1.pbz ]]; then
                installable+=("$pbz")
              fi
            done
            if (( ${#installable[@]} != 1 )); then
              printf 'Expected one installable %s PBZ, found %d\n' \
                "$board" "${#installable[@]}" >&2
              exit 1
            fi
            cp "${installable[0]}" "release/PebbleOS-${board}.pbz"
          done
          (
            cd release
            sha256sum -- PebbleOS-*.pbz > SHA256SUMS
          )
          ls -l release

      - name: Create release
        uses: softprops/action-gh-release@v3.0.2
        with:
          files: release/*

      - name: Publish release to eng-dash
        if: ${{ github.repository == 'coredevices/PebbleOS' }}
        env:
          ENGDASH_URL: https://dash.repebble.com/api/ota/releases/upload
          ENGDASH_TOKEN: ${{ secrets.ENGDASH_OTA_TOKEN }}
        run: |
          set -o pipefail

          publish() {
            file="$1"
            body=$(jq -n \
              --arg version "$TAG" \
              --arg revision "${{ github.sha }}" \
              --arg filename "$(basename "$file")" \
              --arg sha256 "$(sha256sum "$file" | cut -d' ' -f1)" \
              '{version: $version, revision: $revision, filename: $filename, sha256: $sha256}')

            for _ in 1 2; do
              resp=$(curl -sS --fail-with-body -X POST \
                -H "Authorization: Bearer $ENGDASH_TOKEN" \
                -H "Content-Type: application/json" \
                --data "$body" "$ENGDASH_URL") || {
                echo "::error::$file: $resp" >&2
                return 1
              }
              case "$(echo "$resp" | jq -r .status)" in
                uploaded|ignored)
                  echo "$file: $(echo "$resp" | jq -c .)"
                  return 0
                  ;;
                upload_required)
                  curl -sS --fail -X PUT --upload-file "$file" \
                    "$(echo "$resp" | jq -r .upload_url)" || {
                    echo "::error::$file: artifact upload failed" >&2
                    return 1
                  }
                  ;;
                *)
                  echo "::error::$file: unexpected response: $resp" >&2
                  return 1
                  ;;
              esac
            done

            echo "::error::$file: not ingested after upload" >&2
            return 1
          }

          # pbz first: elfs attach to the artifact rows pbzs create
          for file in release/normal_*.pbz; do
            publish "$file"
          done
          for file in release/firmware_*.elf; do
            publish "$file"
          done
