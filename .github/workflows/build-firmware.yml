name: Build Firmware

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes-firmware:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      should-build: ${{ github.event_name != 'pull_request' || steps.filter.outputs.src == 'true' }}
    steps:
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            src:
              - '.github/actions/**'
              - '.github/workflows/build-firmware.yml'
              - 'boards/**'
              - 'platform/**'
              - 'resources/**'
              - 'sdk/**'
              - 'src/**'
              - 'stored_apps/**'
              - 'tools/**'
              - 'third_party/**'
              - 'tools/waf/**'
              - 'waf'
              - 'wscript'

  build-firmware:
    needs: changes-firmware
    if: needs.changes-firmware.outputs.should-build == 'true'
    runs-on: ubuntu-24.04

    container:
      image: ghcr.io/coredevices/pebbleos-docker:v6

    strategy:
      matrix:
        board:
          - asterix
          - obelix@dvt
          - obelix@pvt
          - getafix@evt
          - getafix@dvt
          - getafix@dvt2

    steps:
      - name: Mark Github workspace as safe
        run: git config --system --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Rebase onto target branch
        uses: ./.github/actions/rebase
        with:
          submodules: true

      - name: Install Python dependencies
        run: |
          pip install -U pip
          pip install -r requirements.txt

      - name: Get npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}

      - name: Set artifact board name
        id: artifact_board
        run: echo "NAME=$(printf '%s' "$BOARD" | tr @ _)" >> "$GITHUB_OUTPUT"
        env:
          BOARD: ${{ matrix.board }}

      - name: Configure
        run: ./waf configure --board '${{ matrix.board }}'

      - name: Build
        run: ./waf build

      - name: Bundle
        run: ./waf bundle

      - name: Store
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ steps.artifact_board.outputs.NAME }}
          path: |
            build/**/*.elf
            build/**/*.pbz
            build/pebbleos_loghash_dict.json

      - name: Get Build ID
        id: build_id
        run: |
          echo "BUILD_ID=$(readelf -n build/pebbleos.elf | sed -n -e 's/^.*Build ID: //p')" >> "$GITHUB_OUTPUT"

      - name: Upload log hash dictionary
        if: ${{ github.event_name == 'push' && github.repository == 'coredevices/PebbleOS' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.LOG_HASH_BUCKET_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.LOG_HASH_BUCKET_SECRET }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          pip install awscli
          aws s3 cp build/pebbleos_loghash_dict.json \
            "s3://${{ vars.LOG_HASH_BUCKET_NAME }}/${{ steps.build_id.outputs.BUILD_ID }}-${{ github.sha }}-normal.json" \
            --endpoint-url "${{ vars.LOG_HASH_BUCKET_ENDPOINT }}"

  # Installable RELEASE PBZs, matching the stable release asset shape. The build-firmware job above
  # is single-slot and a debug build, so it cannot provide OTA targets. Obelix and Getafix OTA writes
  # into the inactive slot, therefore their release bundles must merge both slots. The artifacts for
  # obelix_pvt and getafix_dvt2 also remain the hardware-lab release-QA targets.
  build-qa-firmware:
    needs: changes-firmware
    if: needs.changes-firmware.outputs.should-build == 'true'
    runs-on: ubuntu-24.04

    container:
      image: ghcr.io/coredevices/pebbleos-docker:v6

    strategy:
      matrix:
        board:
          - asterix
          - obelix@dvt
          - obelix@pvt
          - getafix@evt
          - getafix@dvt
          - getafix@dvt2

    steps:
      - name: Mark Github workspace as safe
        run: git config --system --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Rebase onto target branch
        uses: ./.github/actions/rebase
        with:
          submodules: true

      - name: Install Python dependencies
        run: |
          pip install -U pip
          pip install -r requirements.txt

      - name: Set artifact board name
        id: artifact_board
        shell: bash
        run: |
          set -euo pipefail
          printf 'NAME=%s\n' "$(printf '%s' "$BOARD" | tr @ _)" >> "$GITHUB_OUTPUT"
        env:
          BOARD: ${{ matrix.board }}

      - name: Build installable release PBZ
        shell: bash
        run: |
          set -euo pipefail
          name='${{ steps.artifact_board.outputs.NAME }}'
          mkdir -p out
          shopt -s nullglob
          case '${{ matrix.board }}' in
            asterix)
              ./waf configure --board '${{ matrix.board }}' -DCONFIG_RELEASE=y
              ./waf build
              ./waf bundle
              pbzs=(build/normal_asterix_*.pbz)
              if (( ${#pbzs[@]} != 1 )); then
                printf 'Expected one asterix PBZ, found %d\n' "${#pbzs[@]}" >&2
                exit 1
              fi
              cp "${pbzs[0]}" "out/$(basename "${pbzs[0]}")"
              ;;
            obelix@*|getafix@*)
              for slot in 0 1; do
                ./waf configure --board '${{ matrix.board }}' -DCONFIG_FIRMWARE_SLOT="$slot" -DCONFIG_RELEASE=y
                ./waf build
                ./waf bundle
                pbzs=(build/normal_"${name}"_*_slot"${slot}".pbz)
                if (( ${#pbzs[@]} != 1 )); then
                  printf 'Expected one %s slot %s PBZ, found %d\n' "$name" "$slot" "${#pbzs[@]}" >&2
                  exit 1
                fi
                cp "${pbzs[0]}" "out/slot${slot}.pbz"
                if (( slot == 0 )); then
                  filename=$(basename "${pbzs[0]}")
                  version=${filename#"normal_${name}_"}
                  version=${version%_slot0.pbz}
                  if [[ -z "$version" || "$version" == "$filename" ]]; then
                    printf 'Could not derive version from %s\n' "$filename" >&2
                    exit 1
                  fi
                fi
              done
              python3 tools/merge_pbz.py --slot0-pbz out/slot0.pbz --slot1-pbz out/slot1.pbz \
                --output "out/normal_${name}_${version}.pbz"
              rm out/slot0.pbz out/slot1.pbz
              ;;
            *)
              printf 'Unsupported board %s\n' '${{ matrix.board }}' >&2
              exit 1
              ;;
          esac
          # Ship the loghash dict alongside so the QA fwlog step can dehash release logs.
          cp build/pebbleos_loghash_dict.json out/ 2>/dev/null || true
          ls -la out

      - name: Store merged QA firmware
        uses: actions/upload-artifact@v7
        with:
          name: qa-firmware-${{ steps.artifact_board.outputs.NAME }}
          path: out/**

  publish-ci-firmware:
    needs: build-qa-firmware
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'm0wer/PebbleOS' &&
      needs.build-qa-firmware.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download installable firmware
        uses: actions/download-artifact@v8
        with:
          pattern: qa-firmware-*
          path: qa-firmware

      - name: Prepare prerelease assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          release_dir=release-assets
          mkdir "$release_dir"
          boards=(asterix obelix_dvt obelix_pvt getafix_evt getafix_dvt getafix_dvt2)

          obelix_pbzs=(qa-firmware/qa-firmware-obelix_pvt/normal_obelix_pvt_*.pbz)
          if (( ${#obelix_pbzs[@]} != 1 )); then
            printf 'Expected one obelix_pvt PBZ, found %d\n' "${#obelix_pbzs[@]}" >&2
            exit 1
          fi
          filename=$(basename "${obelix_pbzs[0]}")
          version=${filename#normal_obelix_pvt_}
          version=${version%.pbz}
          if [[ -z "$version" || "$version" == "$filename" ]]; then
            printf 'Could not derive version from %s\n' "$filename" >&2
            exit 1
          fi

          for board in "${boards[@]}"; do
            pbzs=(qa-firmware/qa-firmware-"${board}"/*.pbz)
            if (( ${#pbzs[@]} != 1 )); then
              printf 'Expected one %s PBZ, found %d\n' "$board" "${#pbzs[@]}" >&2
              exit 1
            fi
            cp "${pbzs[0]}" "$release_dir/PebbleOS-${board}.pbz"
          done
          (
            cd "$release_dir"
            sha256sum PebbleOS-*.pbz > SHA256SUMS
          )
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Create CI prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.assets.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="ci-main-${GITHUB_RUN_ID}"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "PebbleOS CI ${VERSION}" \
              --prerelease \
              --notes "Continuous main-branch firmware build."
            gh release upload "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              release-assets/PebbleOS-*.pbz release-assets/SHA256SUMS
          else
            gh release create "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "PebbleOS CI ${VERSION}" \
              --prerelease \
              --notes "Continuous main-branch firmware build." \
              release-assets/PebbleOS-*.pbz release-assets/SHA256SUMS
          fi

  # Once the dual-slot QA firmware is built, kick off the hardware-lab release-QA in
  # coredevices/unicorn against THIS run's qa-firmware artifact (erase -> PRF -> pair -> OTA ->
  # functional pass on a real phone + watch), using the most recently tagged coreapp release. The
  # unicorn run posts a `unicorn/release-qa` commit status back on this PR's commit. Internal PRs
  # only (forks have no secrets); needs UNICORN_DISPATCH_TOKEN — a PAT with actions:write on unicorn.
  dispatch-release-qa:
    needs: build-qa-firmware
    # Org members / collaborators only: author_association is MEMBER for org members, OWNER for the
    # repo owner, COLLABORATOR for added collaborators — external contributors (CONTRIBUTOR/NONE) are
    # excluded, so an outside PR can't spend the hardware lab.
    if: >-
      github.event_name == 'pull_request' &&
      needs.build-qa-firmware.result == 'success' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-24.04
    # One in-flight QA per PR: a newer push supersedes the older dispatch instead of queueing extras.
    concurrency:
      group: release-qa-dispatch-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Dispatch the hardware-lab release-QA (coredevices/unicorn)
        env:
          GH_TOKEN: ${{ secrets.UNICORN_DISPATCH_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::UNICORN_DISPATCH_TOKEN not set — add a PAT with actions:write on coredevices/unicorn to run the hardware release-QA automatically"
            exit 0
          fi
          # to_pbz_run_id = this Build Firmware run (its qa-firmware-<board> artifact is the "to").
          # coreapp_run_id omitted -> unicorn uses the most recently tagged coreapp release.
          gh workflow run one-off-pebbleos-test.yml -R coredevices/unicorn \
            -f to_pbz_run_id=${{ github.run_id }}

  build-firmware-status:
    needs: [changes-firmware, build-firmware]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - if: needs.build-firmware.result == 'failure' || needs.build-firmware.result == 'cancelled'
        run: exit 1
